# Information for Learners
learners: 'In this workshop, participants will learn how to leverage the DataCite REST API to discover resources with DataCite DOIs and to register DOIs with rich metadata. The facilitators will use Postman for API request demonstrations, guiding participants through a library of requests that can be tailored for different use cases. The workshop will be organized into two parts, followed by time for questions and hands-on support with API requests.'

# Information for Instructors
instructors: 'The proposed session length is 3 hours (half day). The facilitators can accommodate a maximum of 30 attendees.'

# Learner Profiles
profiles: 'This workshop is targeted at librarians, developers, and metadata enthusiasts who are interested in working with DataCite DOI metadata.'

