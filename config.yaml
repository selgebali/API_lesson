#------------------------------------------------------------
# Values for this lesson.
#------------------------------------------------------------

# Which carpentry is this (swc, dc, lc, or cp)?
# swc: Software Carpentry
# dc: Data Carpentry
# lc: Library Carpentry
# cp: Carpentries (to use for instructor training for instance)
# incubator: The Carpentries Incubator
# 
# This option supports custom types so lessons can be branded
# and themed with your own logo and alt-text (see `carpentry_description`)
# See https://carpentries.github.io/sandpaper-docs/editing.html#adding-a-custom-logo
carpentry: 'datacite-logo'

# Alt-text description of the lesson.
carpentry_description: 'This workshop will guide participants on using the DataCite REST API to work with DataCite DOI metadata. Participants will learn how to:
Retrieve DOI metadata: Participants will learn how to use the DataCite REST API to search DOIs in the DataCite Metadata Store, including how to construct queries, apply filters, and retrieve a complete list of results.
Create DOIs with rich metadata: Participants will try out DOI registration in the DataCite test system and learn how to update DOI metadata, taking full advantage of the DataCite Metadata Schema’s capabilities.'

